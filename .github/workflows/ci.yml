# CI: evaluate the whole flake and build both standalone homes.
#
# flake-check evaluates every output the flake exports — the NixOS host
# against its tracked hardware file, both standalone homeConfigurations,
# and the rest — without building anything (~1 min). It catches the common
# failure mode (module/option breakage after a `nix flake update`) fast.
#
# build-homes goes one step further: it builds the exact activationPackage
# each non-NixOS machine pulls — ryan-linux on an x86_64-linux runner,
# ryan-intel-mac on GitHub's Intel macOS runners (the last x86_64 images
# Actions offers) — catching build failures that evaluation cannot see.
# The NixOS toplevel itself stays unbuilt in CI: a full system build on an
# unpersisted runner costs hours for little signal, and build failures
# there surface at the desktop's `nixos-rebuild` anyway.
#
# The build job's substituters are the repo's set (modules/nixos/base.nix)
# minus the LAN harmonia server, which GitHub runners cannot reach;
# cache.numtide.com likely carries the llm-agents tools built against
# their own nixpkgs pin, psysonic.cachix.org the psysonic tool.
#
# cachix-action adds the personal binary cache (name "nix-configs", auth
# token in CACHIX_AUTH_TOKEN, self-owned signing key in
# CACHIX_SIGNING_KEY): paths a job builds are pushed once it finishes,
# and later runs substitute them instead of rebuilding. The step is
# skipped while either secret is absent, so the workflow is green both
# before and without the cache.
#
# This also covers the git-backup timer's automated commits to main
# (modules/batman/backup.nix): no push, human or timer, may carry a config
# that fails to evaluate or build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Pin the evaluator — nix itself is otherwise an unpinned input.
          # 2.35 changed flake check's eval-context realization: on a fresh
          # store it no longer builds fixed-output fetches that evaluation
          # reads (the raycast monorepo vicinae's mkRayCastExtension
          # importJSONs), failing with "path ... is not valid". 2.34.8 is
          # the desktop's version — evaluator parity keeps local
          # `nix flake check` and CI identical.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          # Authenticate GitHub API requests: the flake fetches ~13 locked
          # inputs, and unauthenticated runner IPs regularly exhaust the
          # 60 req/hr shared rate limit.
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            # nix-configs (same cache the build jobs push to): evaluation
            # reads files from fixed-output fetches (the raycast monorepo),
            # so the eval-context FODs must be substitutable — otherwise
            # every run re-downloads the monorepo from GitHub (2.34) or
            # fails outright (2.35).
            substituters = https://nix-configs.cachix.org https://cache.nixos.org
            trusted-public-keys = nix-configs.cachix.org-1:7Ujoj71uBp3xoxOBwPF8CTJAmoaz0+I/Dm1yK0dNyBw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Warm eval-context sources
        # flake check --no-build cannot realize eval-context sources on a
        # cold store: vicinae's mkRayCastExtension filters the raycast
        # monorepo at eval time, and those context drvs cannot be
        # substituted — flake check dies with "path ... is not valid"
        # (reproduced in a fresh local store; green locally only because
        # the desktop's store is warm). A plain build realizes them, and
        # everything else substitutes from nix-configs. Same caveat for
        # any fresh machine: build before the first flake check.
        run: nix build --no-link .#homeConfigurations.ryan-linux.activationPackage

      - name: Evaluate all flake outputs
        run: nix flake check --no-build

  build-homes:
    strategy:
      # A darwin failure should not cancel the linux build (or vice versa).
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            home: ryan-linux
          - os: macos-26-intel
            home: ryan-intel-mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The ryan-linux closure (nvf, ghostty, discord, obsidian, ...) plus
      # toolchains can outgrow the ~14GB free on stock ubuntu runners.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Same pin as flake-check (see comment there): evaluator parity
          # with the desktop and freedom from 2.35's eval-context change.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://nix-configs.cachix.org https://cache.nixos.org https://cache.numtide.com https://psysonic.cachix.org
            trusted-public-keys = nix-configs.cachix.org-1:7Ujoj71uBp3xoxOBwPF8CTJAmoaz0+I/Dm1yK0dNyBw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= psysonic.cachix.org-1:M9cQyQ7tgvUWOQ5Pyt8ozlMoPLtOZir6MfRuTH9/VYA=

      - name: Configure cachix
        # Skipped until both cachix secrets exist (auth token + the
        # self-owned signing key), so CI was green before the cache
        # existed. The secrets context is not allowed in `if:`
        # expressions — the check is routed through env, which is
        # allowed. Fork PRs never see secrets and skip the step.
        env:
          have_cachix_keys: ${{ secrets.CACHIX_AUTH_TOKEN != '' && secrets.CACHIX_SIGNING_KEY != '' }}
        if: env.have_cachix_keys == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-configs
          # Self-signing mode: the keypair is ours, not cachix's — the
          # secret half lives in CACHIX_SIGNING_KEY, the public half is
          # registered at cachix and in modules/nixos/base.nix.
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
          # useDaemon: false — the daemon's post-build-hook push path
          # does not inherit the signing key; uploads go unsigned and
          # every batch 400s server-side while the step still reports
          # success. The post-step push applies the key correctly.
          #
          # CACHIX_SIGNING_KEY holds the BARE secret — exactly as
          # `cachix generate-keypair` stores it in cachix.dhall, with NO
          # `name:` prefix. A prefixed value fails server-side signature
          # verification on every pushed path (verified twice, the
          # painful way). Do not "fix" it back to name:secret format.
          #
          # installCommand is left at the action default on purpose:
          # `nix profile install nixpkgs#cachix` evaluates unstable
          # nixpkgs, which throws "dropped support for x86_64-darwin"
          # on the Intel macOS runner.
          useDaemon: false

      - name: Build the ${{ matrix.home }} activation package
        run: nix build .#homeConfigurations.${{ matrix.home }}.activationPackage
