# vulnix whitelist — accepted-risk / false-positive CVEs ONLY.
# Format: https://github.com/nix-community/vulnix (doc/vulnix.1.md, "WHITELISTING")
#
# The CI job (`vulnix`, .github/workflows/ci.yml) scans each host's REAL
# toplevel *runtime closure* (vulnix -C, baked into the `.#vulnix-scan`
# wrapper) and fails on any finding not covered below. Sections must be
# the exact derivation name-version (case-sensitive) and every entry
# lists its CVEs explicitly: never drop the cve list, or the section
# would silently suppress *future* vulnerabilities in that package.
#
# Every entry below was triaged against the NVD CPE data vulnix itself
# used (the by-product dump of its cached feed), not just by name:
#
#   FP:    false positive — the NVD product is a different product that
#          shares the derivation's name (vendor given in the comment),
#          or the derivation's version is not in the affected range
#          (date-bounded CPEs, name artifacts like `dbus-1`).
#   Real:  genuinely affected at the pinned version, with no fix in the
#          pinned nixpkgs (dc5d91f, 2026-09-07) at triage time —
#          accepted risk with a re-review note. Most "Real" entries
#          retire themselves: their sections are version-pinned, so the
#          next `nixpkgs` bump makes them stop matching and surfaces the
#          new versions for fresh triage instead.
#
# Do not add entries just to make a red job green: triage first.
#
# Triaged 2026-09-11 against nixpkgs 26.11.20260907.dc5d91f.

